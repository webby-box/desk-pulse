<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0c0e">
  <title>Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <p class="brand">desk</p>
        <p class="sub" id="last-updated">—</p>
      </div>
      <div class="mark-box">
        <span id="mark-label" class="k">—</span>
        <span id="live-mark" class="mono">—</span>
      </div>
    </header>

    <div id="err" class="err" hidden role="alert"></div>

    <section class="metrics" aria-label="Book">
      <article>
        <h2>Liquid</h2>
        <p id="liquid" class="n">—</p>
      </article>
      <article>
        <h2>uPnL</h2>
        <p id="upnl" class="n">—</p>
      </article>
      <article>
        <h2>Equity</h2>
        <p id="equity" class="n">—</p>
      </article>
    </section>

    <section class="block" aria-label="Positions">
      <h2>Position</h2>
      <div id="pos-empty" class="empty" hidden>No open ticket</div>
      <div id="pos-list"></div>
    </section>

    <details class="more">
      <summary>History &amp; trades</summary>
      <div id="spark-wrap" class="spark-wrap">
        <svg id="spark" viewBox="0 0 320 64" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div id="hist-empty" class="empty" hidden>No snaps</div>
      <div class="scroll">
        <table>
          <thead><tr><th>t</th><th>uPnL</th><th>eq</th></tr></thead>
          <tbody id="hist-body"></tbody>
        </table>
      </div>
      <div id="trades-empty" class="empty" hidden>No trades</div>
      <div class="scroll">
        <table>
          <thead><tr><th>t</th><th>mkt</th><th>side</th><th>pnl</th></tr></thead>
          <tbody id="trades-body"></tbody>
        </table>
      </div>
    </details>

    <footer class="foot">
      <span id="wallet" class="mono">—</span>
      <span id="book-age" class="dim">—</span>
    </footer>
    <p id="notes" class="notes"></p>
    <ul id="residuals-list" class="res"></ul>
    <p class="dim tiny"><span id="src">—</span> · <span id="mark-age">—</span></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
