<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0d10">
  <title>Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <p class="brand">Desk</p>
    <p class="asof"><span id="last-updated">—</span></p>
  </header>

  <main>
    <div id="err" class="err" hidden role="alert"></div>

    <section class="hero" aria-label="Equity">
      <p class="hero-k">Equity</p>
      <p id="equity" class="hero-n">—</p>
      <p id="upnl" class="hero-pnl">—</p>
      <div class="hero-return" aria-label="Total vs original">
        <div>
          <span class="k">Original</span>
          <span id="funding" class="num">—</span>
        </div>
        <div>
          <span class="k">Total PnL</span>
          <span id="total-pnl" class="num">—</span>
        </div>
      </div>
      <div class="hero-sub">
        <div>
          <span class="k">Liquid</span>
          <span id="liquid" class="num">—</span>
        </div>
        <div>
          <span class="k"><span id="mark-label">ETH</span> mark</span>
          <span id="live-mark" class="num">—</span>
          <span id="mark-age" class="age">—</span>
        </div>
      </div>
    </section>

    <section class="panel" aria-label="Positions">
      <div class="panel-h">
        <h2>Position</h2>
        <span id="pos-count" class="count">0</span>
      </div>
      <div id="pos-empty" class="empty" hidden>No open position</div>
      <div id="pos-list"></div>
    </section>

    <details class="fold">
      <summary>History</summary>
      <div id="spark-wrap" class="spark-wrap">
        <svg id="spark" viewBox="0 0 320 64" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div id="hist-empty" class="empty" hidden>No snaps</div>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Time</th><th>uPnL</th><th>Equity</th><th>n</th></tr>
          </thead>
          <tbody id="hist-body"></tbody>
        </table>
      </div>
    </details>

    <details class="fold">
      <summary>Trades</summary>
      <div id="trades-empty" class="empty" hidden>No trades</div>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Time</th><th>Kind</th><th>Mkt</th><th>Side</th><th>Size</th><th>PnL</th><th>Tx</th></tr>
          </thead>
          <tbody id="trades-body"></tbody>
        </table>
      </div>
    </details>

    <section class="meta">
      <p><span class="k">Wallet</span> <span id="wallet" class="num wrap">—</span></p>
      <p><span class="k">Notes</span> <span id="notes" class="wrap">—</span></p>
      <ul id="residuals-list" class="res"></ul>
    </section>

    <footer>
      <span id="src">—</span>
      <span id="book-age">book —</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
